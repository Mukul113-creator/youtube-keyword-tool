services:
  - type: web
    name: youtube-keyword-tool
    env: python
    buildCommand: |
      pip install setuptools pip wheel --upgrade
      pip install pkg_resources
      pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: YOUTUBE_API_KEY
        sync
